name: VieNeu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vieneu-android-poc
    paths:
      - 'deployments/vieneu-android/**'
      - '.github/workflows/vieneu-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 29.0.14206865
      ORT_VERSION: 1.24.3
      VIENEU_COMMIT: 838979faf0354ffb3dff898e30b709f644fa7db4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and native build tools
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "cmake;3.31.6" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip curl git

      - name: Clone pinned VieNeu-TTS.cpp
        run: |
          mkdir -p .build
          git clone --depth 1 https://github.com/dduongtrandai/VieNeu-TTS.cpp.git .build/vieneu-src
          git -C .build/vieneu-src fetch --depth 1 origin "${VIENEU_COMMIT}"
          git -C .build/vieneu-src checkout --detach "${VIENEU_COMMIT}"
          git -C .build/vieneu-src submodule sync --recursive
          git -C .build/vieneu-src submodule update --init --recursive --depth 1
          test "$(git -C .build/vieneu-src rev-parse HEAD)" = "${VIENEU_COMMIT}"
          git -C .build/vieneu-src rev-parse HEAD
          git -C .build/vieneu-src submodule status --recursive

      - name: Instrument VieNeu core diagnostics
        run: |
          python3 deployments/vieneu-android/native/instrument_vieneu_diagnostics.py .build/vieneu-src
          git -C .build/vieneu-src diff --check
          grep -n 'V3NativeDiag' .build/vieneu-src/src/vieneu/v3_native/vieneu_v3_native.cpp

      - name: Prepare ONNX Runtime Android C++ SDK
        run: |
          mkdir -p .build/ort-aar .build/ort-sdk/include .build/ort-sdk/lib
          curl -fL --retry 3 \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/${ORT_VERSION}/onnxruntime-android-${ORT_VERSION}.aar" \
            -o .build/onnxruntime-android.aar
          unzip -q .build/onnxruntime-android.aar -d .build/ort-aar
          cp .build/ort-aar/jni/arm64-v8a/libonnxruntime.so .build/ort-sdk/lib/
          git clone --depth 1 --branch "v${ORT_VERSION}" \
            https://github.com/microsoft/onnxruntime.git .build/ort-src
          cp .build/ort-src/include/onnxruntime/core/session/*.h .build/ort-sdk/include/
          test -f .build/ort-sdk/include/onnxruntime_cxx_api.h
          test -f .build/ort-sdk/lib/libonnxruntime.so

      - name: Configure Android native runtime and JNI
        run: |
          cmake -S deployments/vieneu-android/native -B .build/vieneu-android-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DVIENEU_SOURCE_DIR="${GITHUB_WORKSPACE}/.build/vieneu-src" \
            -DONNXRUNTIME_ROOT="${GITHUB_WORKSPACE}/.build/ort-sdk" \
            -DVIENEU_PORTABLE_CPU=ON \
            -DVIENEU_NATIVE_BACKEND=cpu \
            -DVIENEU_SEA_G2P=OFF \
            -DBUILD_TESTING=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF

      - name: Build native runtime and JNI
        run: cmake --build .build/vieneu-android-native --target vieneu_jni -j2

      - name: Package ARM64 native libraries
        run: |
          DEST="deployments/vieneu-android/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$DEST"
          mkdir -p "$DEST"

          for LIB in libvieneu_jni.so libvieneu-tts.so libllama.so libggml.so libggml-cpu.so libggml-base.so; do
            SRC="$(find .build/vieneu-android-native -type f -name "$LIB" | head -n 1)"
            test -n "$SRC"
            cp "$SRC" "$DEST/$LIB"
          done
          cp .build/ort-sdk/lib/libonnxruntime.so "$DEST/"

          CXX_SHARED="$(find "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64" -type f -name 'libc++_shared.so' | grep 'aarch64-linux-android' | head -n 1)"
          OMP_SHARED="$(find "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64" -type f -name 'libomp.so' | grep -E '/aarch64/' | head -n 1)"
          test -n "$CXX_SHARED"
          test -n "$OMP_SHARED"
          cp "$CXX_SHARED" "$DEST/libc++_shared.so"
          cp "$OMP_SHARED" "$DEST/libomp.so"

          STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for LIB in "$DEST"/*.so; do
            "$STRIP" --strip-unneeded "$LIB" || true
          done

          echo "Packaged libraries:"
          ls -lh "$DEST"
          strings "$DEST/libvieneu-tts.so" | grep 'V3NativeDiag'
          for LIB in "$DEST"/*.so; do
            file "$LIB"
            readelf -d "$LIB" | grep NEEDED || true
          done

      - name: Build debug APK
        run: |
          chmod +x deployments/android/gradlew
          cd deployments/vieneu-android
          ../android/gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="deployments/vieneu-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/'
          unzip -l "$APK" | grep 'libvieneu_jni.so'
          unzip -l "$APK" | grep 'libomp.so'
          unzip -l "$APK" | grep 'libc++_shared.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-voice-clone-android-arm64-debug
          path: deployments/vieneu-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
