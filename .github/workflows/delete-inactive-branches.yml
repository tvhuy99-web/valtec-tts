name: Delete inactive experiment branches

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/delete-inactive-branches.yml'

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete inactive agent branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/android-apk-build'
            'agent/android-zeroshot-clone'
            'agent/repo-unused-file-cleanup'
            'agent/vieneu-android-opencl-poc'
            'agent/vieneu-android-poc'
            'agent/vieneu-android-vulkan-poc'
            'agent/vieneu-parity-rebuild'
          )

          for branch in "${branches[@]}"; do
            ref="heads/$branch"
            if gh api "repos/$REPO/git/ref/$ref" >/dev/null 2>&1; then
              echo "Deleting $branch"
              gh api --method DELETE "repos/$REPO/git/refs/$ref"
            else
              echo "Already absent: $branch"
            fi
          done

          for branch in "${branches[@]}"; do
            ref="heads/$branch"
            if gh api "repos/$REPO/git/ref/$ref" >/dev/null 2>&1; then
              echo "::error::Branch still exists: $branch"
              exit 1
            fi
          done

          echo 'All inactive experiment branches were deleted.'
