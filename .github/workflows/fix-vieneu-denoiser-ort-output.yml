name: Fix VieNeu Denoiser ORT Output

on:
  push:
    branches:
      - agent/reference-quality-v4-build
    paths:
      - '.github/workflows/fix-vieneu-denoiser-ort-output.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-quality-v4-build
          fetch-depth: 0

      - name: Patch ORT outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deployments/vieneu-android/native/optimize_vieneu_android_generation_quality.py')
          s = p.read_text(encoding='utf-8')
          old = '''        const auto input_ptrs = ptrs(input_names);
        const auto output_ptrs = ptrs(output_names);
        Ort::RunOptions run_options;
        run_options.AddConfigEntry("memory.enable_memory_arena_shrinkage", "cpu:0");
        auto outputs = session_->Run(
            run_options,
            input_ptrs.data(),
            inputs.data(),
            inputs.size(),
            output_ptrs.data(),
            output_ptrs.size());

        const float* sep_mag = nullptr;
        const float* sep_cos = nullptr;
        const float* sep_sin = nullptr;
        for (size_t i = 0; i < output_names.size(); ++i) {
            const auto info = outputs[i].GetTensorTypeAndShapeInfo();
            size_t count = 1;
            for (int64_t dim : info.GetShape()) {
                if (dim <= 0) {
                    warning = "Reference denoiser returned an invalid tensor shape.";
                    return false;
                }
                count *= static_cast<size_t>(dim);
            }
            if (count != spectral_values) {
                warning = "Reference denoiser returned an unexpected tensor size.";
                return false;
            }
            const float* data = outputs[i].GetTensorData<float>();
            if (output_names[i] == "sep_mag") sep_mag = data;
            else if (output_names[i] == "sep_cos") sep_cos = data;
            else if (output_names[i] == "sep_sin") sep_sin = data;
            else {
                warning = "Reference denoiser ONNX output names do not match VieNeu v3 Turbo.";
                return false;
            }
        }
        if (!sep_mag || !sep_cos || !sep_sin) {
            warning = "Reference denoiser ONNX outputs are incomplete.";
            return false;
        }
'''
          new = '''        std::vector<float> sep_mag_storage(spectral_values);
        std::vector<float> sep_cos_storage(spectral_values);
        std::vector<float> sep_sin_storage(spectral_values);
        std::vector<Ort::Value> outputs;
        outputs.reserve(output_names.size());
        for (const std::string& name : output_names) {
            float* data = nullptr;
            if (name == "sep_mag") data = sep_mag_storage.data();
            else if (name == "sep_cos") data = sep_cos_storage.data();
            else if (name == "sep_sin") data = sep_sin_storage.data();
            else {
                warning = "Reference denoiser ONNX output names do not match VieNeu v3 Turbo.";
                return false;
            }
            outputs.emplace_back(Ort::Value::CreateTensor<float>(
                memory,
                data,
                spectral_values,
                shape.data(),
                shape.size()));
        }

        const auto input_ptrs = ptrs(input_names);
        const auto output_ptrs = ptrs(output_names);
        Ort::RunOptions run_options;
        run_options.AddConfigEntry("memory.enable_memory_arena_shrinkage", "cpu:0");
        session_->Run(
            run_options,
            input_ptrs.data(),
            inputs.data(),
            inputs.size(),
            output_ptrs.data(),
            outputs.data(),
            outputs.size());

        const float* sep_mag = sep_mag_storage.data();
        const float* sep_cos = sep_cos_storage.data();
        const float* sep_sin = sep_sin_storage.data();
'''
          if s.count(old) != 1:
              raise SystemExit(f'ORT output block expected once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile deployments/vieneu-android/native/optimize_vieneu_android_generation_quality.py
          grep -q 'outputs.data()' deployments/vieneu-android/native/optimize_vieneu_android_generation_quality.py
          git diff --check
          git config user.name 'tvhuy99-web'
          git config user.email 'tvhuy99@gmail.com'
          git add deployments/vieneu-android/native/optimize_vieneu_android_generation_quality.py
          git commit -m 'Fix VieNeu denoiser ONNX output tensors'
          git push origin HEAD:agent/reference-quality-v4-build
