name: VieNeu Pinned Model Rebuild Parity

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vieneu-parity-rebuild
    paths:
      - '.github/workflows/vieneu-pinned-model-parity.yml'
      - 'deployments/vieneu-android/parity/**'

permissions:
  contents: write

env:
  CPP_COMMIT: 838979faf0354ffb3dff898e30b709f644fa7db4
  OFFICIAL_SOURCE_COMMIT: 54f42abf4460e68aac79c985b9446557c2180f2f
  OFFICIAL_MODEL_REVISION: 75ff82a72f54d55ed389e1eeb12041d3c4bac7d4
  NATIVE_BASE_REVISION: a7b4f40050d4ff6d5225d8fd4fe6d571913844a2
  ORT_VERSION: 1.24.4
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  rebuild-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout parity tooling
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install parity dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            'huggingface_hub[hf_xet]>=0.34' \
            'onnxruntime==1.24.4' \
            onnx numpy safetensors tokenizers transformers sentencepiece protobuf soundfile

      - name: Rebuild pinned model and run numerical parity
        id: parity
        continue-on-error: true
        shell: bash
        run: bash deployments/vieneu-android/parity/run_pinned_model_parity_ci.sh

      - name: Upload complete parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-pinned-model-parity-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload parity-approved model pack
        if: steps.parity.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-v3-turbo-pinned-parity-model
          path: models/pinned
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish immutable parity-approved model release
        if: steps.parity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash deployments/vieneu-android/parity/publish_pinned_model_release.sh \
            vieneu-model-parity-75ff82a7 \
            models/pinned \
            evidence

      - name: Reject model when parity is not proven
        if: steps.parity.outcome != 'success'
        shell: bash
        run: |
          echo '::error::The rebuilt model did not pass strict numerical parity. Inspect the evidence artifact.'
          exit 1
