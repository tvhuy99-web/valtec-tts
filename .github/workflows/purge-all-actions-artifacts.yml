name: Purge All GitHub Actions Data
on:
  push:
    paths: ['.github/workflows/purge-all-actions-artifacts.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: purge-all-actions-data
  cancel-in-progress: false
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts, caches, logs and old workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          api() { gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "$@"; }
          da=0; fa=0; dc=0; fc=0; dr=0; fr=0
          mapfile -t ids < <(api --paginate "repos/${REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          for id in "${ids[@]}"; do if api -X DELETE "repos/${REPOSITORY}/actions/artifacts/${id}"; then da=$((da+1)); else fa=$((fa+1)); fi; done
          mapfile -t ids < <(api --paginate "repos/${REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[].id')
          for id in "${ids[@]}"; do if api -X DELETE "repos/${REPOSITORY}/actions/caches/${id}"; then dc=$((dc+1)); else fc=$((fc+1)); fi; done
          mapfile -t rows < <(api --paginate "repos/${REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id,.status] | @tsv')
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r id status <<< "$row"
            [[ "$id" == "$CURRENT_RUN_ID" ]] && continue
            api -X DELETE "repos/${REPOSITORY}/actions/runs/${id}/logs" >/dev/null 2>&1 || true
            if api -X DELETE "repos/${REPOSITORY}/actions/runs/${id}"; then dr=$((dr+1)); continue; fi
            if [[ "$status" != completed ]]; then
              api -X POST "repos/${REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
              removed=false
              for attempt in {1..12}; do sleep 5; if api -X DELETE "repos/${REPOSITORY}/actions/runs/${id}"; then dr=$((dr+1)); removed=true; break; fi; done
              [[ "$removed" == false ]] && fr=$((fr+1))
            else fr=$((fr+1)); fi
          done
          { echo '## Full GitHub Actions purge'; echo "- Artifacts deleted: **$da**, failures: **$fa**"; echo "- Caches deleted: **$dc**, failures: **$fc**"; echo "- Old runs deleted: **$dr**, failures: **$fr**"; echo '- Current cleanup run retained.'; } >> "$GITHUB_STEP_SUMMARY"
          failures=$((fa+fc+fr)); ((failures>0)) && exit 1 || true
