name: Apply VieNeu Reference Quality V4

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.vieneu-quality-chunks/**'
      - '.github/workflows/apply-vieneu-reference-quality-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.vieneu-quality-chunks/**') != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/reference-quality-v4-build

      - name: Reconstruct validated sources
        shell: bash
        run: |
          set -euo pipefail
          NATIVE='deployments/vieneu-android/native'
          cat .vieneu-quality-chunks/genq_new.part.* > "$NATIVE/optimize_vieneu_android_generation_quality.py"
          cat .vieneu-quality-chunks/completion_new.part.* > "$NATIVE/optimize_vieneu_android_completion_quality.py"
          cat .vieneu-quality-chunks/cache_v4.part.* > "$NATIVE/optimize_vieneu_android_cache_v4.py"
          cat .vieneu-quality-chunks/opt_new.part.* > "$NATIVE/optimize_vieneu_android.py"
          cat .vieneu-quality-chunks/short_text_new.part.* > "$NATIVE/optimize_vieneu_android_short_text.py"
          cat .vieneu-quality-chunks/prepare_new.part.* > "$NATIVE/prepare_vieneu_android_build.py"

          printf '%s\n' \
            '7a840b0e19a1985789cab5061963ec6354e1b8a2051f0eb399ad2c8887429d89  deployments/vieneu-android/native/optimize_vieneu_android_generation_quality.py' \
            'e4da57b64dbd5c323f23fb729ed3854955f80c3732c889bc9d4f6034a37c573d  deployments/vieneu-android/native/optimize_vieneu_android_completion_quality.py' \
            'f09d85ad4f437980399059d0be81e321b225d6ec0b68ee31b6da48498ba8f955  deployments/vieneu-android/native/optimize_vieneu_android_cache_v4.py' \
            'ccc246e90244097559155c378bc7dc29e011039561fa64f54b07db1f0aed13a9  deployments/vieneu-android/native/optimize_vieneu_android.py' \
            '60f529266eed94157dcac2d750f47f6dc97ad442189ad50cbce6b72365d9f906  deployments/vieneu-android/native/optimize_vieneu_android_short_text.py' \
            '45fef7431bfab8f112d4ba0fb3a2318ec9087ee349d73256e8a5013619fa09f8  deployments/vieneu-android/native/prepare_vieneu_android_build.py' \
            | sha256sum -c -

      - name: Finalize v4 repository state
        shell: bash
        run: |
          set -euo pipefail
          NATIVE='deployments/vieneu-android/native'
          rm -f "$NATIVE/optimize_vieneu_android_cache_v3.py"
          printf 'VERSION_CODE=25\nVERSION_NAME=0.9.8-reference-denoise-cache-v4\n' > deployments/vieneu-android/version.properties

          python3 -m py_compile \
            "$NATIVE/optimize_vieneu_android_generation_quality.py" \
            "$NATIVE/optimize_vieneu_android_completion_quality.py" \
            "$NATIVE/optimize_vieneu_android_cache_v4.py" \
            "$NATIVE/optimize_vieneu_android.py" \
            "$NATIVE/optimize_vieneu_android_short_text.py" \
            "$NATIVE/prepare_vieneu_android_build.py"
          grep -q 'content-addressed-v4' "$NATIVE/prepare_vieneu_android_build.py"
          grep -q 'fresh_normal_stable_deterministic' "$NATIVE/optimize_vieneu_android_completion_quality.py"
          grep -q 'kReferenceCodesCacheVersion = 4' "$NATIVE/optimize_vieneu_android_cache_v4.py"
          grep -q 'kDenoiseFft = 1680' "$NATIVE/optimize_vieneu_android_generation_quality.py"
          git diff --check

      - name: Publish clean staging branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vieneu-quality-chunks
          git config user.name 'tvhuy99-web'
          git config user.email 'tvhuy99@gmail.com'
          git add -A
          git commit -m 'Implement VieNeu reference denoise and cache v4'
          git push origin HEAD:agent/reference-quality-v4-build
