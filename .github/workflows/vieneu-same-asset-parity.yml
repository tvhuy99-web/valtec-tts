name: VieNeu Same-Asset Runtime Parity

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vieneu-android-opencl-poc
    paths:
      - ".github/workflows/vieneu-same-asset-parity.yml"
      - "deployments/vieneu-android/parity/run_same_asset_parity.py"

permissions:
  actions: read
  contents: read

env:
  BASE_PARITY_RUN: "32016124230"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "huggingface_hub[hf_xet]>=0.34" \
            "onnxruntime==1.24.4" \
            numpy tokenizers soundfile

      - name: Download completed native parity evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parity-out
          gh run download "$BASE_PARITY_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name vieneu-native-numerical-parity \
            --dir parity-out
          test -f parity-out/native/native_prefill_h.f32

      - name: Clone official engine source
        run: git clone --depth 1 https://github.com/pnnbao97/VieNeu-TTS.git official-python

      - name: Download exact native heads and official ONNX update package
        run: |
          mkdir -p models/native models/official
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="lastudio-community/VieNeu-TTS-v3-Turbo-CPP",
              revision="a7b4f40050d4ff6d5225d8fd4fe6d571913844a2",
              allow_patterns=[
                  "voices_v3_turbo.json",
                  "vieneu_v3_heads.npz",
                  "codec/moss_audio_tokenizer_decode_full.onnx",
                  "codec/moss_audio_tokenizer_decode_shared.data",
                  "codec/moss_audio_tokenizer_decode_step.onnx",
                  "codec/codec_browser_onnx_meta.json",
              ],
              local_dir="models/native",
          )
          snapshot_download(
              repo_id="pnnbao-ump/VieNeu-TTS-v3-Turbo",
              revision="75ff82a72f54d55ed389e1eeb12041d3c4bac7d4",
              allow_patterns=["onnx_update/*"],
              local_dir="models/official",
          )
          PY

      - name: Isolate runtime math with identical native package heads
        run: |
          mkdir -p parity-out/same-asset
          python deployments/vieneu-android/parity/run_same_asset_parity.py \
            --official-source official-python \
            --onnx-dir models/official/onnx_update \
            --native-model-dir models/native \
            --native-dump-dir parity-out/native \
            --output-dir parity-out/same-asset \
            2>&1 | tee parity-out/same-asset/same-asset-run.log

      - name: Upload isolated parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-same-asset-runtime-parity
          path: parity-out/same-asset
          if-no-files-found: error
          retention-days: 30
