name: Retry dev cleanup APK build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/verify-dev-cleanup.yml'

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  retry-and-verify:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 6736dbd5abea36ca16b43e9dc96de7d1ead36eab
      STUCK_RUN_ID: '32087821649'
    steps:
      - name: Cancel stalled runner and dispatch a fresh canonical build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel "$STUCK_RUN_ID" --repo "$REPO" || true
          gh workflow run vieneu-android-apk.yml --repo "$REPO" --ref dev

          run_id=''
          for _ in $(seq 1 120); do
            run_id="$(gh run list \
              --repo "$REPO" \
              --workflow vieneu-android-apk.yml \
              --event workflow_dispatch \
              --branch dev \
              --limit 20 \
              --json databaseId,headSha,event \
              --jq ".[] | select(.headSha == \"$CURRENT_SHA\" and .event == \"workflow_dispatch\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            gh api --method POST "repos/$REPO/statuses/$TARGET_SHA" \
              -f state=failure \
              -f context=vieneu-dev-cleanup-apk-retry \
              -f description='Fresh canonical APK run was not found'
            exit 1
          fi

          run_url="https://github.com/$REPO/actions/runs/$run_id"
          gh api --method POST "repos/$REPO/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context=vieneu-dev-cleanup-apk-retry \
            -f description='Fresh canonical signed APK build is running' \
            -f "target_url=$run_url"

          for _ in $(seq 1 180); do
            state="$(gh run view "$run_id" --repo "$REPO" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')"
            echo "run=$run_id state=$state"
            if [[ "$state" == completed:* ]]; then
              conclusion="${state#completed:}"
              if [[ "$conclusion" == success ]]; then
                gh api --method POST "repos/$REPO/statuses/$TARGET_SHA" \
                  -f state=success \
                  -f context=vieneu-dev-cleanup-apk-retry \
                  -f description='Fresh canonical signed APK build passed' \
                  -f "target_url=$run_url"
                exit 0
              fi
              gh api --method POST "repos/$REPO/statuses/$TARGET_SHA" \
                -f state=failure \
                -f context=vieneu-dev-cleanup-apk-retry \
                -f description="Fresh canonical APK build: $conclusion" \
                -f "target_url=$run_url"
              exit 1
            fi
            sleep 10
          done

          gh api --method POST "repos/$REPO/statuses/$TARGET_SHA" \
            -f state=failure \
            -f context=vieneu-dev-cleanup-apk-retry \
            -f description='Fresh canonical APK build timed out' \
            -f "target_url=$run_url"
          exit 1
