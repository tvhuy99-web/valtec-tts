name: VieNeu Native Acoustic Same-Weight Parity

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vieneu-android-opencl-poc
    paths:
      - ".github/workflows/vieneu-native-acoustic-numpy-parity.yml"
      - "deployments/vieneu-android/parity/run_native_acoustic_numpy_parity.py"

permissions:
  actions: read
  contents: read

env:
  BASE_PARITY_RUN: "32016124230"
  NATIVE_MODEL_REVISION: "a7b4f40050d4ff6d5225d8fd4fe6d571913844a2"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  acoustic-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout parity scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub[hf_xet]>=0.34" numpy

      - name: Download clean native CPU parity evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parity-out model/acoustic
          gh run download "$BASE_PARITY_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name vieneu-native-numerical-parity \
            --dir parity-out
          test -f parity-out/native/native_prefill_h.f32
          test -f parity-out/native/native_codes.csv

      - name: Download exact native config heads and acoustic weights
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          repo = "lastudio-community/VieNeu-TTS-v3-Turbo-CPP"
          revision = "a7b4f40050d4ff6d5225d8fd4fe6d571913844a2"
          for source, target in [
              ("config.json", "model/config.json"),
              ("vieneu_v3_heads.npz", "model/vieneu_v3_heads.npz"),
              ("acoustic/vieneu_acoustic_weights.npz", "model/acoustic/vieneu_acoustic_weights.npz"),
          ]:
              path = hf_hub_download(repo_id=repo, filename=source, revision=revision)
              import shutil
              shutil.copyfile(path, target)
          PY
          sha256sum model/config.json model/vieneu_v3_heads.npz model/acoustic/vieneu_acoustic_weights.npz \
            | tee parity-out/native-model-files.sha256

      - name: Run independent NumPy acoustic oracle
        run: |
          mkdir -p parity-out/acoustic-numpy
          python deployments/vieneu-android/parity/run_native_acoustic_numpy_parity.py \
            --native-model-dir model \
            --native-dump-dir parity-out/native \
            --output parity-out/acoustic-numpy/report.json \
            2>&1 | tee parity-out/acoustic-numpy/run.log

      - name: Upload acoustic parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-native-acoustic-same-weight-parity
          path: parity-out
          if-no-files-found: error
          retention-days: 30
