name: VieNeu Acoustic Prefill Stage Parity

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vieneu-android-opencl-poc
    paths:
      - ".github/workflows/vieneu-acoustic-stage-parity.yml"

permissions:
  actions: read
  contents: read

env:
  EXACT_PARITY_RUN: "32018011992"
  NATIVE_MODEL_REVISION: "a7b4f40050d4ff6d5225d8fd4fe6d571913844a2"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  compare-stages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout comparator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub[hf_xet]>=0.34" numpy

      - name: Download exact-F32 native trace evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence model/acoustic result
          gh run download "$EXACT_PARITY_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name vieneu-native-exact-f32-parity \
            --dir evidence
          test -f evidence/native/native_trace_00_x_plus_position.f32
          test -f evidence/native/native_trace_07_x_after_layer.f32

      - name: Download identical native acoustic assets
        run: |
          python - <<'PY'
          import shutil
          from huggingface_hub import hf_hub_download
          repo = "lastudio-community/VieNeu-TTS-v3-Turbo-CPP"
          revision = "a7b4f40050d4ff6d5225d8fd4fe6d571913844a2"
          for source, target in [
              ("config.json", "model/config.json"),
              ("vieneu_v3_heads.npz", "model/vieneu_v3_heads.npz"),
              ("acoustic/vieneu_acoustic_weights.npz", "model/acoustic/vieneu_acoustic_weights.npz"),
          ]:
              shutil.copyfile(hf_hub_download(repo_id=repo, filename=source, revision=revision), target)
          PY

      - name: Locate first acoustic prefill tensor divergence
        run: |
          python deployments/vieneu-android/parity/run_native_acoustic_trace_compare.py \
            --native-model-dir model \
            --native-dump-dir evidence/native \
            --output result/acoustic-stage-report.json \
            2>&1 | tee result/run.log

      - name: Upload stage comparison
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-acoustic-prefill-stage-parity
          path: result
          if-no-files-found: error
          retention-days: 30
