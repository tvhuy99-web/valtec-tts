name: Dispatch VieNeu Android Parity Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/vieneu-parity-rebuild
    paths:
      - 'deployments/vieneu-android/app/**'
      - 'deployments/vieneu-android/native/**'
      - '.github/workflows/vieneu-android-parity-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the full Android OpenCL build on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vieneu-android-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
          echo "Dispatched vieneu-android-apk.yml on $GITHUB_REF_NAME"
