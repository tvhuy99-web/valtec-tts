name: VieNeu Android CI Relay

on:
  push:
    branches:
      - agent/vieneu-android-opencl-poc
    paths:
      - deployments/vieneu-android/**
      - .github/workflows/vieneu-android-ci-relay.yml

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  publish-validated-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Mark canonical validation pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending \
            -f context=vieneu-android-canonical \
            -f description='Canonical signed APK validation is running'

      - name: Wait for the canonical APK workflow
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 90); do
            run_id="$(gh run list \
              --repo "$REPO" \
              --workflow vieneu-android-apk.yml \
              --event push \
              --commit "$HEAD_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "Canonical VieNeu APK run was not found for $HEAD_SHA" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 180); do
            state="$(gh run view "$run_id" --repo "$REPO" --json status,conclusion --jq '.status + ":" + (.conclusion // "")')"
            echo "canonical_run=$run_id state=$state"
            if [[ "$state" == completed:* ]]; then
              conclusion="${state#completed:}"
              if [[ "$conclusion" != success ]]; then
                gh run view "$run_id" --repo "$REPO" --log-failed || true
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "Canonical VieNeu APK run did not finish within relay polling budget" >&2
          exit 1

      - name: Download canonical APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p relay-artifact
          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name vieneu-voice-clone-android-arm64-opencl-quality \
            --dir relay-artifact
          apk="$(find relay-artifact -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" relay-artifact/VieNeu-0.9.3-log-clear-ui-cleanup-arm64.apk
          sha256sum relay-artifact/VieNeu-0.9.3-log-clear-ui-cleanup-arm64.apk \
            | tee relay-artifact/VieNeu-0.9.3-log-clear-ui-cleanup-arm64.apk.sha256

      - name: Publish immutable CI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${HEAD_SHA:0:12}"
          tag="vieneu-android-ci-$short_sha"
          gh release create "$tag" \
            --repo "$REPO" \
            --target "$HEAD_SHA" \
            --prerelease \
            --title "VieNeu Android 0.9.3 CI $short_sha" \
            --notes "Canonical workflow run: $RUN_ID" \
            relay-artifact/VieNeu-0.9.3-log-clear-ui-cleanup-arm64.apk \
            relay-artifact/VieNeu-0.9.3-log-clear-ui-cleanup-arm64.apk.sha256

      - name: Publish canonical validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        shell: bash
        run: |
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Canonical signed APK and prerelease artifact passed'
          else
            state=failure
            description='Canonical VieNeu APK validation failed'
          fi
          args=(
            --method POST "repos/$REPO/statuses/$HEAD_SHA"
            -f "state=$state"
            -f context=vieneu-android-canonical
            -f "description=$description"
          )
          if [[ -n "${RUN_ID:-}" ]]; then
            args+=( -f "target_url=https://github.com/$REPO/actions/runs/$RUN_ID" )
          fi
          gh api "${args[@]}"
